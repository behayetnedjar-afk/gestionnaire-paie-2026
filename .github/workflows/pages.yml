name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests du moteur de paie (bloquants)
        run: npm test

      - name: Vérifier les fichiers JSON
        run: |
          for f in parametres/*.json packages/contenu/modules/*/qcm.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "JSON invalide : $f"; exit 1; }
          done

      - name: Compiler le moteur pour le navigateur
        run: npm run build:site

      - name: Assembler le site
        run: |
          mkdir -p _site/packages
          cp -r site/. _site/
          cp -r parametres _site/parametres
          cp -r packages/contenu _site/packages/contenu
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
